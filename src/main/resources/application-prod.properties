# WhatsApp Clone - Production Configuration\n# ===========================================\n\n# Server Configuration\nserver.port=8080\nserver.servlet.context-path=/\nserver.compression.enabled=true\nserver.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json\nserver.compression.min-response-size=1024\nserver.http2.enabled=true\nserver.error.include-stacktrace=never\nserver.error.include-message=never\n\n# Database Configuration\nspring.datasource.url=jdbc:mysql://localhost:3306/whatsapp_clone?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true\nspring.datasource.username=${DB_USERNAME:whatsapp_user}\nspring.datasource.password=${DB_PASSWORD:secure_password}\nspring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver\n\n# Connection Pool Configuration\nspring.datasource.hikari.maximum-pool-size=20\nspring.datasource.hikari.minimum-idle=5\nspring.datasource.hikari.idle-timeout=300000\nspring.datasource.hikari.max-lifetime=1200000\nspring.datasource.hikari.connection-timeout=20000\nspring.datasource.hikari.validation-timeout=3000\nspring.datasource.hikari.leak-detection-threshold=60000\n\n# JPA Configuration\nspring.jpa.hibernate.ddl-auto=validate\nspring.jpa.show-sql=false\nspring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect\nspring.jpa.properties.hibernate.format_sql=false\nspring.jpa.properties.hibernate.use_sql_comments=false\nspring.jpa.properties.hibernate.jdbc.batch_size=25\nspring.jpa.properties.hibernate.order_inserts=true\nspring.jpa.properties.hibernate.order_updates=true\nspring.jpa.properties.hibernate.jdbc.batch_versioned_data=true\nspring.jpa.properties.hibernate.connection.provider_disables_autocommit=true\nspring.jpa.properties.hibernate.cache.use_second_level_cache=true\nspring.jpa.properties.hibernate.cache.use_query_cache=true\nspring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory\n\n# Redis Configuration\nspring.data.redis.host=${REDIS_HOST:localhost}\nspring.data.redis.port=${REDIS_PORT:6379}\nspring.data.redis.password=${REDIS_PASSWORD:}\nspring.data.redis.database=0\nspring.data.redis.timeout=2000ms\nspring.data.redis.lettuce.pool.max-active=20\nspring.data.redis.lettuce.pool.max-idle=8\nspring.data.redis.lettuce.pool.min-idle=2\nspring.data.redis.lettuce.pool.max-wait=-1ms\nspring.data.redis.lettuce.shutdown-timeout=100ms\n\n# Security Configuration\nspring.security.user.name=admin\nspring.security.user.password=${ADMIN_PASSWORD:admin123}\nspring.security.user.roles=ADMIN\n\n# JWT Configuration\napp.jwt.secret=${JWT_SECRET:mySecretKey123456789012345678901234567890}\napp.jwt.expiration=3600\napp.jwt.refresh-expiration=2592000\n\n# OTP Configuration\napp.otp.expiration=300\napp.otp.max-attempts=3\napp.otp.max-resends=3\n\n# Session Configuration\napp.session.max-devices=5\napp.session.temp-expiration=300\n\n# Message Configuration\napp.message.max-length=4096\napp.message.page-size=50\n\n# File Upload Configuration\nspring.servlet.multipart.enabled=true\nspring.servlet.multipart.max-file-size=100MB\nspring.servlet.multipart.max-request-size=100MB\napp.upload.max-file-size=104857600\napp.upload.allowed-types=jpg,jpeg,png,gif,mp4,mp3,pdf,doc,docx\napp.upload.path=${UPLOAD_PATH:/tmp/uploads}\n\n# Rate Limiting Configuration\napp.rate-limit.requests-per-minute=60\napp.rate-limit.otp-requests-per-hour=5\n\n# WebSocket Configuration\napp.websocket.heartbeat-interval=30\napp.websocket.connection-timeout=300\n\n# Story Configuration\napp.story.expiration-hours=24\napp.story.max-per-day=10\n\n# Call Configuration\napp.call.max-duration=3600\napp.call.max-participants=8\n\n# Async Configuration\napp.async.core-pool-size=10\napp.async.max-pool-size=50\napp.async.queue-capacity=100\napp.async.keep-alive-seconds=60\napp.async.thread-name-prefix=whatsapp-async-\n\n# Cache Configuration\napp.cache.default-ttl=3600\napp.cache.user-profile-ttl=1800\napp.cache.contacts-ttl=900\napp.cache.conversations-ttl=600\napp.cache.session-validation-ttl=300\n\n# Logging Configuration\nlogging.level.com.whatsapp=INFO\nlogging.level.org.springframework.security=WARN\nlogging.level.org.hibernate.SQL=WARN\nlogging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN\nlogging.level.com.zaxxer.hikari=WARN\nlogging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n\nlogging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n\nlogging.file.name=logs/whatsapp-app.log\nlogging.file.max-size=10MB\nlogging.file.max-history=30\n\n# Actuator Configuration\nmanagement.endpoints.web.exposure.include=health,info,metrics,prometheus\nmanagement.endpoint.health.show-details=when-authorized\nmanagement.metrics.export.prometheus.enabled=true\nmanagement.health.redis.enabled=true\nmanagement.health.db.enabled=true\n\n# Application Information\ninfo.app.name=WhatsApp Clone\ninfo.app.description=Production-ready WhatsApp-like messaging system\ninfo.app.version=1.0.0\ninfo.app.encoding=@project.build.sourceEncoding@\ninfo.app.java.version=@java.version@\n\n# Jackson Configuration\nspring.jackson.serialization.write-dates-as-timestamps=false\nspring.jackson.time-zone=UTC\nspring.jackson.default-property-inclusion=NON_NULL\n\n# Validation Configuration\nspring.validation.add-validation-starter=true\n\n# Transaction Configuration\nspring.transaction.default-timeout=30\nspring.transaction.rollback-on-commit-failure=true\n\n# Thymeleaf Configuration (if using)\nspring.thymeleaf.cache=true\nspring.thymeleaf.mode=HTML\nspring.thymeleaf.encoding=UTF-8\n\n# DevTools (disable in production)\nspring.devtools.restart.enabled=false\nspring.devtools.livereload.enabled=false\n\n# Profile-specific configurations\nspring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}\n\n# External Service URLs (configure as needed)\napp.external.sms-service.url=${SMS_SERVICE_URL:}\napp.external.email-service.url=${EMAIL_SERVICE_URL:}\napp.external.push-notification.url=${PUSH_NOTIFICATION_URL:}\napp.external.file-storage.url=${FILE_STORAGE_URL:}\n\n# Monitoring and Observability\napp.monitoring.enabled=true\napp.metrics.enabled=true\napp.tracing.enabled=true\n\n# Security Headers\napp.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}\napp.security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS\napp.security.cors.allowed-headers=*\napp.security.cors.allow-credentials=true\n\n# API Documentation\nspringdoc.api-docs.enabled=true\nspringdoc.swagger-ui.enabled=true\nspringdoc.swagger-ui.path=/swagger-ui.html\nspringdoc.api-docs.path=/api-docs\n\n# Error Handling\nserver.error.whitelabel.enabled=false\nspring.mvc.throw-exception-if-no-handler-found=true\nspring.web.resources.add-mappings=false"